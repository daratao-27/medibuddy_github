name: medibuddy
description: "MediBuddy - Your daily medication companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  firebase_core: ^4.6.0
  flutter_riverpod: ^3.3.1
  firebase_auth: ^6.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.2.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "images/pill.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "images/pill.png"

# Native splash screen shown while the app is starting up, before main.dart
# has finished running. Uses the same pill icon as the app icon and
# MediBuddy's peach brand background, so the two feel consistent.
flutter_native_splash:
  color: "#FFF0EF"
  image: images/pill.png
  android_12:
    color: "#FFF0EF"
    image: images/pill.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - images/
